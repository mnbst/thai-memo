plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// --dart-define=ENV=<dev|tester|prod> に合わせて google-services.json を選ぶ。
// Android の Firebase は google-services.json の設定で既定アプリを作るので、
// Dart 側の firebase_options だけ prod にしても、このファイルが tester だと
// tester の Firebase につながってしまう。
// 環境別のファイルは app/google-services/<env>.json に置く（gitignore 済み）。
def dartEnv = 'dev'
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encoded ->
        def define = new String(encoded.decodeBase64(), 'UTF-8')
        if (define.startsWith('ENV=')) {
            dartEnv = define.substring('ENV='.length())
        }
    }
}
def envGoogleServices = file("google-services/${dartEnv}.json")
if (envGoogleServices.exists()) {
    copy {
        from envGoogleServices
        into projectDir
        rename { 'google-services.json' }
    }
} else {
    logger.warn("google-services/${dartEnv}.json が無いため、既存の google-services.json を使います")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}



android {
    namespace "com.thaimemo.thai_memo"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // tester は別アプリ（iOS の com.thaimemo.Test と同じ考え方）。同じパッケージと
        // 署名鍵の Android OAuth クライアントは prod プロジェクトにしか作れないため、
        // 同じパッケージのままでは tester の Google サインインが通らない。
        applicationId dartEnv == 'tester' ? "com.thaimemo.thai_memo.test" : "com.thaimemo.thai_memo"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
    // アプリ内レビュー（ReviewPromptChannel）
    implementation "com.google.android.play:review:2.0.2"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
