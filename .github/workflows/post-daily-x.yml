name: Post Daily Sentence to X

# platform=x は X、threads は Threads に出す。枠の時刻は同じで、例文は別の文を選ぶ
# （pick_sentence.py が両方の投稿済みを外す）。同じ枠の2本は concurrency で順番に走らせ、
# 後に走る方が先の投稿を見て選べるようにする。
# kind=sentence は例文（動画＋画面）、tip / guide は tools/x_post/study_posts.json の
# 投稿文（ガイドはガイド画面の該当欄の画像付き）。枠ごとの kind は Terraform の
# x_post_extra_slots で決める。

on:
  # 毎朝 07:00 JST に Cloud Scheduler（terraform/main.tf の post_daily_x）が
  # workflow_dispatch で起動する。GitHub の schedule は遅延・欠落が多いため使わない。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず、本文とメディアの確認だけ行う'
        type: boolean
        default: false
      themes:
        description: '抽選するテーマ（カンマ区切り。空なら全部: タイ旅行,タイ生活,恋愛）'
        type: string
        default: ''
      slot:
        description: '投稿の枠（0700 など）。空なら起動した時刻から決める'
        type: string
        default: ''
      kind:
        description: '出すもの（sentence: 例文 / tip: Tips / guide: ガイド）'
        type: choice
        options: [sentence, tip, guide]
        default: sentence
      platform:
        description: '投稿先（x / threads）'
        type: choice
        options: [x, threads]
        default: x

concurrency:
  # 同じ枠の X と Threads を並べて走らせない（同じ例文を選ばないように）。
  group: post-daily-${{ inputs.slot || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # WIF認証に必要

env:
  # 配信用とは別のプール・SA（terraform/main.tf の x_post）。署名鍵には届かない。
  WIF_PROVIDER: projects/219961294368/locations/global/workloadIdentityPools/github-x-post-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-x-post@thai-memo-prod.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-prod
  OUT_DIR: build/x_post
  KIND: ${{ inputs.kind || 'sentence' }}
  PLATFORM: ${{ inputs.platform || 'x' }}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch X credentials from Secret Manager
        if: env.PLATFORM == 'x'
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: secrets
        with:
          secrets: |-
            X_API_KEY:${{ env.GCP_PROJECT }}/x-api-key
            X_API_SECRET:${{ env.GCP_PROJECT }}/x-api-secret
            X_ACCESS_TOKEN:${{ env.GCP_PROJECT }}/x-access-token
            X_ACCESS_TOKEN_SECRET:${{ env.GCP_PROJECT }}/x-access-token-secret

      - name: Fetch Threads credentials from Secret Manager
        if: env.PLATFORM == 'threads'
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: threads_secrets
        with:
          secrets: |-
            THREADS_ACCESS_TOKEN:${{ env.GCP_PROJECT }}/threads-access-token

      - name: Install dependencies
        run: |
          flutter pub get
          pip install -r tools/x_post/requirements.txt
          if [ "$KIND" = sentence ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Fetch Japanese font
        run: tools/x_post/fetch_fonts.sh

      - name: Pick sentence
        if: env.KIND == 'sentence'
        # X の鍵は直近投稿の反応を引くのに使う。クレジットが無い間は
        # 引けずに諦めるだけで、選定も投稿も止まらない。
        env:
          X_API_KEY: ${{ steps.secrets.outputs.X_API_KEY }}
          X_API_SECRET: ${{ steps.secrets.outputs.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ steps.secrets.outputs.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ steps.secrets.outputs.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ steps.threads_secrets.outputs.THREADS_ACCESS_TOKEN }}
          THEMES: ${{ inputs.themes }}
          SLOT: ${{ inputs.slot }}
        # 種は枠ごとに変える。同じ日の枠で同じ抽選にならないように。
        run: |
          python tools/x_post/pick_sentence.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" \
            --seed "$(date -u +%F)-$SLOT-$PLATFORM" --themes "$THEMES" --slot "$SLOT" \
            --platform "$PLATFORM"

      - name: Pick tip or guide
        if: env.KIND != 'sentence'
        run: |
          python tools/x_post/pick_study_post.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" --kind "$KIND" \
            --platform "$PLATFORM"

      # ガイドはアプリのガイド画面から、該当する欄（Card）だけを切り出して貼る。
      # 描けなくても本文だけで出す。
      - name: Render guide section
        if: env.KIND == 'guide'
        continue-on-error: true
        run: |
          set -a; . "$OUT_DIR/guide_shot.env"; set +a
          flutter test test/screenshots/guide_screenshot.dart \
            --dart-define=SCREEN="$SCREEN" \
            --dart-define=FROM="$FROM" \
            --dart-define=H=12000 \
            --dart-define=OUT="$OUT_DIR/image_1.png"

      - name: Synthesize pronunciation
        if: env.KIND == 'sentence'
        run: |
          python tools/x_post/synth_tts.py \
            --sentence "$OUT_DIR/sentence.json" --out "$OUT_DIR"

      # 画面の録画は読み上げの尺に合わせるので、音声を先に作る。
      - name: Render screenshots and frames
        if: env.KIND == 'sentence'
        run: |
          AUDIO_MS=$(ffprobe -v error -show_entries format=duration \
            -of csv=p=0 "$OUT_DIR/audio.mp3" | awk '{printf "%d", $1 * 1000}')
          echo "読み上げ ${AUDIO_MS}ms"
          flutter test test/screenshots/x_post_screenshot.dart \
            --dart-define=X_POST_SENTENCE=$OUT_DIR/sentence.json \
            --dart-define=X_POST_OUT=$OUT_DIR \
            --dart-define=X_POST_AUDIO_MS=$AUDIO_MS

      - name: Build media
        if: env.KIND == 'sentence'
        run: python tools/x_post/build_media.py --out "$OUT_DIR"

      - name: Upload media as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PLATFORM }}-post-media
          path: |
            ${{ env.OUT_DIR }}/image_*.png
            ${{ env.OUT_DIR }}/post.mp4
            ${{ env.OUT_DIR }}/text.txt
          retention-days: 7

      - name: Post to X
        if: env.PLATFORM == 'x'
        env:
          X_API_KEY: ${{ steps.secrets.outputs.X_API_KEY }}
          X_API_SECRET: ${{ steps.secrets.outputs.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ steps.secrets.outputs.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ steps.secrets.outputs.X_ACCESS_TOKEN_SECRET }}
        run: |
          python tools/x_post/post_to_x.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Post to Threads
        if: env.PLATFORM == 'threads'
        env:
          THREADS_ACCESS_TOKEN: ${{ steps.threads_secrets.outputs.THREADS_ACCESS_TOKEN }}
          # メディアの署名付き URL を作る SA（自分への signBlob を Terraform で許可済み）。
          THREADS_SIGNER: ${{ env.CI_SERVICE_ACCOUNT }}
        run: |
          python tools/x_post/post_to_threads.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" \
            --token-secret "projects/$GCP_PROJECT/secrets/threads-access-token" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
