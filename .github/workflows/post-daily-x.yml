name: Post Daily Sentence to X

on:
  # 毎朝 07:00 JST に Cloud Scheduler（terraform/main.tf の post_daily_x）が
  # workflow_dispatch で起動する。GitHub の schedule は遅延・欠落が多いため使わない。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず、本文とメディアの確認だけ行う'
        type: boolean
        default: false
      themes:
        description: '抽選するテーマ（カンマ区切り。空なら全部: タイ旅行,タイ生活,恋愛）'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write  # WIF認証に必要

env:
  # 配信用とは別のプール・SA（terraform/main.tf の x_post）。署名鍵には届かない。
  WIF_PROVIDER: projects/219961294368/locations/global/workloadIdentityPools/github-x-post-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-x-post@thai-memo-prod.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-prod
  OUT_DIR: build/x_post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch X credentials from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        id: secrets
        with:
          secrets: |-
            X_API_KEY:${{ env.GCP_PROJECT }}/x-api-key
            X_API_SECRET:${{ env.GCP_PROJECT }}/x-api-secret
            X_ACCESS_TOKEN:${{ env.GCP_PROJECT }}/x-access-token
            X_ACCESS_TOKEN_SECRET:${{ env.GCP_PROJECT }}/x-access-token-secret

      - name: Install dependencies
        run: |
          flutter pub get
          pip install -r tools/x_post/requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch Japanese font
        run: tools/x_post/fetch_fonts.sh

      - name: Pick sentence
        env:
          THEMES: ${{ inputs.themes }}
        run: |
          python tools/x_post/pick_sentence.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" --seed "$(date -u +%F)" \
            --themes "$THEMES"

      - name: Synthesize pronunciation
        run: |
          python tools/x_post/synth_tts.py \
            --sentence "$OUT_DIR/sentence.json" --out "$OUT_DIR"

      # 画面の録画は読み上げの尺に合わせるので、音声を先に作る。
      - name: Render screenshots and frames
        run: |
          AUDIO_MS=$(ffprobe -v error -show_entries format=duration \
            -of csv=p=0 "$OUT_DIR/audio.mp3" | awk '{printf "%d", $1 * 1000}')
          echo "読み上げ ${AUDIO_MS}ms"
          flutter test test/screenshots/x_post_screenshot.dart \
            --dart-define=X_POST_SENTENCE=$OUT_DIR/sentence.json \
            --dart-define=X_POST_OUT=$OUT_DIR \
            --dart-define=X_POST_AUDIO_MS=$AUDIO_MS

      - name: Build media
        run: python tools/x_post/build_media.py --out "$OUT_DIR"

      - name: Upload media as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-post-media
          path: |
            ${{ env.OUT_DIR }}/image_*.png
            ${{ env.OUT_DIR }}/post.mp4
            ${{ env.OUT_DIR }}/text.txt
          retention-days: 7

      - name: Post to X
        env:
          X_API_KEY: ${{ steps.secrets.outputs.X_API_KEY }}
          X_API_SECRET: ${{ steps.secrets.outputs.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ steps.secrets.outputs.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ steps.secrets.outputs.X_ACCESS_TOKEN_SECRET }}
        run: |
          python tools/x_post/post_to_x.py \
            --project "$GCP_PROJECT" --out "$OUT_DIR" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
