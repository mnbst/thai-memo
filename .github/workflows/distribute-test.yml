  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            GOOGLE_SERVICE_INFO_PLIST_BASE64:${{ env.GCP_PROJECT }}/ci-google-service-info-plist
            P12_BASE64:${{ env.GCP_PROJECT }}/ci-p12-cert
            P12_PASSWORD:${{ env.GCP_PROJECT }}/ci-p12-password
            PROVISIONING_PROFILE_BASE64:${{ env.GCP_PROJECT }}/ci-provisioning-profile

      - name: Restore GoogleService-Info.plist
        run: echo '${{ steps.secrets.outputs.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}' | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          P12_BASE64: ${{ steps.secrets.outputs.P12_BASE64 }}
          P12_PASSWORD: ${{ steps.secrets.outputs.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ steps.secrets.outputs.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          if [ -z "$UUID" ]; then
            echo "ERROR: Failed to extract UUID from provisioning profile"
            exit 1
          fi
          echo "Profile UUID: $UUID"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Override signing for CI
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.thaimemo.thaiMemo;/PRODUCT_BUNDLE_IDENTIFIER = com.thaimemo.Test;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          export PROFILE_NAME
          echo "Profile Name: $PROFILE_NAME"
          python3 << 'PYEOF'
          import os
          profile_name = os.environ['PROFILE_NAME']
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + profile_name + '";'
          )
          with open(path, 'w') as f:
              f.write(content)
          print('Replaced with:', profile_name)
          PYEOF
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.thaimemo.Test $PROFILE_NAME" ios/ExportOptions.tester.plist

      - name: Debug signing settings
        run: |
          echo "=== PROVISIONING_PROFILE_SPECIFIER ==="
          grep "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "=== CODE_SIGN_STYLE ==="
          grep "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj
          echo "=== ExportOptions.tester.plist ==="
          cat ios/ExportOptions.tester.plist

      - name: Build IPA
        run: flutter build ipa --dart-define=ENV=tester --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.tester.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-tester
          path: build/ios/ipa/*.ipa
          retention-days: 5
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  # ビルド成功後にここだけ失敗した場合、"Re-run failed jobs" でこのジョブのみ再実行できる
  upload-ios:
    needs: build-ios
    runs-on: macos-26
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ipa-tester
          path: ipa

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            APPLE_ID:${{ env.GCP_PROJECT }}/ci-apple-id
            APP_SPECIFIC_PASSWORD:${{ env.GCP_PROJECT }}/ci-app-specific-password

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ steps.secrets.outputs.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ steps.secrets.outputs.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ipa/*.ipa \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
