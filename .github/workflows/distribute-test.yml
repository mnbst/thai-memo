name: Distribute to Testers

on:
  push:
    branches:
      - test
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.vscode/**'
      - 'reports/**'
      - 'scripts/**'
      - 'terraform/**'
      - 'test/**'
      - 'web/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'analysis_options.yaml'
      - '.gitignore'
      - '.metadata'

permissions:
  contents: read
  pull-requests: read
  id-token: write  # WIF認証に必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WIF_PROVIDER: projects/763566155520/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-deployer@thai-memo-67139.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-67139

