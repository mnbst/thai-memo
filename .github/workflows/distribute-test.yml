name: Distribute to Testers

on:
  push:
    branches:
      - test
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/**'
      - '.claude/**'
      - '.vscode/**'
      - 'reports/**'
      - 'scripts/**'
      - 'terraform/**'
      - 'test/**'
      - 'web/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'analysis_options.yaml'
      - '.gitignore'
      - '.metadata'

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and build JS functions
        run: cd functions/javascript && npm ci && npm run build

      - name: Setup Python venv for Firebase
        run: |
          cd functions/python
          python3 -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          firebase deploy --only functions,firestore:rules --project tester
          rm /tmp/gcp_key.json

  build-and-distribute-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Restore google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/thai-memo-upload.keystore
          cat <<EOF > android/app/key.properties
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=thai-memo-upload.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --dart-define=ENV=tester

      - name: Get PR release notes
        id: pr_info
        run: |
          NOTES=$(gh pr list --state merged --base test --limit 1 --json title,body --jq '.[0] | (.title) + "\n" + (.body // "")')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_TESTER }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: group1
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.pr_info.outputs.notes }}

