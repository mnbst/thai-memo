name: Distribute to Testers

on:
  push:
    branches:
      - test
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.vscode/**'
      - 'reports/**'
      - 'scripts/**'
      - 'terraform/**'
      - 'test/**'
      - 'web/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'analysis_options.yaml'
      - '.gitignore'
      - '.metadata'

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and build JS functions
        run: cd functions/javascript && npm ci && npm run build

      - name: Setup Python venv for Firebase
        run: |
          cd functions/python
          python3 -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          export FUNCTIONS_DISCOVERY_TIMEOUT=60000
          firebase deploy --only functions,firestore:rules,firestore:indexes --project tester
          rm /tmp/gcp_key.json

  build-and-distribute-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Restore google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/thai-memo-release.jks
          cat <<EOF > android/app/key.properties
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=thai-memo-release.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --dart-define=ENV=tester

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thaimemo.thai_memo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  build-and-distribute-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Restore GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}' | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          if [ -z "$UUID" ]; then
            echo "ERROR: Failed to extract UUID from provisioning profile"
            exit 1
          fi
          echo "Profile UUID: $UUID"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Override signing for CI
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' ios/Runner.xcodeproj/project.pbxproj
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          export PROFILE_NAME
          echo "Profile Name: $PROFILE_NAME"
          python3 << 'PYEOF'
          import os
          profile_name = os.environ['PROFILE_NAME']
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + profile_name + '";'
          )
          with open(path, 'w') as f:
              f.write(content)
          print('Replaced with:', profile_name)
          PYEOF
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.thaimemo.thaiMemo $PROFILE_NAME" ios/ExportOptions.plist

      - name: Debug signing settings
        run: |
          echo "=== PROVISIONING_PROFILE_SPECIFIER ==="
          grep "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "=== CODE_SIGN_STYLE ==="
          grep "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj
          echo "=== ExportOptions.plist ==="
          cat ios/ExportOptions.plist

      - name: Build IPA
        run: flutter build ipa --dart-define=ENV=tester --export-options-plist=ios/ExportOptions.plist

      - name: Get PR release notes
        id: pr_info
        run: |
          NOTES=$(gh pr list --state merged --base test --limit 1 --json title,body --jq '.[0] | (.title) + "\n" + (.body // "")')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
