name: Distribute to Testers (Android)

# push では動かさず、配信するときだけ手で起動する:
#   gh workflow run distribute-test-android.yml --ref test
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: tester
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # 3.x の最新は Gradle 8.14 以上を要求する。手元と同じ版に固定する。
          flutter-version: "3.47.8"
          channel: stable

      - name: Restore google-services.json
        # secret は式でシェル本文に埋め込まず、環境変数で渡す（値に引用符や $() があっても実行されない）。
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/thai-memo-release.jks
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=thai-memo-release.jks\nstorePassword=%s\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/app/key.properties

      - name: Install dependencies
        run: flutter pub get

      # versionCode は Play に上げ済みの 145 を超えるよう、実行番号に 200 を足す。
      - name: Build AAB
        run: flutter build appbundle --dart-define=ENV=tester --build-number=$((GITHUB_RUN_NUMBER + 200))

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab-tester
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5
          if-no-files-found: error

  # ビルド成功後にここだけ失敗した場合、"Re-run failed jobs" でこのジョブのみ再実行できる
  upload-android:
    needs: build-android
    runs-on: ubuntu-latest
    environment: tester
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aab-tester
          path: aab

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thaimemo.thai_memo.test
          releaseFiles: aab/app-release.aab
          track: internal
          status: completed
