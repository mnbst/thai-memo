name: Distribute to Testers (Android)

# push では動かさず、配信するときだけ手で起動する:
#   gh workflow run distribute-test-android.yml --ref test
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write  # WIF認証に必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WIF_PROVIDER: projects/763566155520/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-deployer@thai-memo-67139.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-67139

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # 3.x の最新は Gradle 8.14 以上を要求する。手元と同じ版に固定する。
          flutter-version: "3.41.5"
          channel: stable

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            GOOGLE_SERVICES_JSON:${{ env.GCP_PROJECT }}/ci-google-services-json
            KEYSTORE_BASE64:${{ env.GCP_PROJECT }}/ci-keystore
            KEY_ALIAS:${{ env.GCP_PROJECT }}/ci-key-alias
            KEY_PASSWORD:${{ env.GCP_PROJECT }}/ci-key-password
            STORE_PASSWORD:${{ env.GCP_PROJECT }}/ci-store-password

      - name: Restore google-services.json
        run: echo '${{ steps.secrets.outputs.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Restore keystore
        run: |
          echo "${{ steps.secrets.outputs.KEYSTORE_BASE64 }}" | base64 --decode > android/app/thai-memo-release.jks
          cat <<EOF > android/app/key.properties
          keyAlias=${{ steps.secrets.outputs.KEY_ALIAS }}
          keyPassword=${{ steps.secrets.outputs.KEY_PASSWORD }}
          storeFile=thai-memo-release.jks
          storePassword=${{ steps.secrets.outputs.STORE_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # versionCode は Play に上げ済みの 145 を超えるよう、実行番号に 200 を足す。
      - name: Build AAB
        run: flutter build appbundle --dart-define=ENV=tester --build-number=$((GITHUB_RUN_NUMBER + 200))

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-tester
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5
          if-no-files-found: error

  # ビルド成功後にここだけ失敗した場合、"Re-run failed jobs" でこのジョブのみ再実行できる
  upload-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-tester
          path: aab

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:${{ env.GCP_PROJECT }}/ci-google-play-service-account

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thaimemo.thai_memo
          releaseFiles: aab/app-release.aab
          track: internal
          status: completed
