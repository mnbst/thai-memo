name: Distribute to Production (Android)

# push では動かさず、配信するときだけ手で起動する:
#   gh workflow run distribute-prod-android.yml --ref main -f track=internal
on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play のトラック
        type: choice
        options:
          - internal
          - alpha
          - production
        default: internal

permissions:
  contents: read
  pull-requests: read
  id-token: write  # WIF認証に必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WIF_PROVIDER: projects/219961294368/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-deployer@thai-memo-prod.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-prod

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # 3.x の最新は Gradle 8.14 以上を要求する。手元と同じ版に固定する。
          flutter-version: "3.41.5"
          channel: stable

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: secrets
        with:
          secrets: |-
            GOOGLE_SERVICES_JSON:${{ env.GCP_PROJECT }}/ci-google-services-json
            KEYSTORE_BASE64:${{ env.GCP_PROJECT }}/ci-keystore
            KEY_ALIAS:${{ env.GCP_PROJECT }}/ci-key-alias
            KEY_PASSWORD:${{ env.GCP_PROJECT }}/ci-key-password
            STORE_PASSWORD:${{ env.GCP_PROJECT }}/ci-store-password
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:${{ env.GCP_PROJECT }}/ci-google-play-service-account

      - name: Restore google-services.json
        # secret は式でシェル本文に埋め込まず、環境変数で渡す（値に引用符や $() があっても実行されない）。
        env:
          GOOGLE_SERVICES_JSON: ${{ steps.secrets.outputs.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ steps.secrets.outputs.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ steps.secrets.outputs.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.secrets.outputs.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ steps.secrets.outputs.STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/thai-memo-release.jks
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=thai-memo-release.jks\nstorePassword=%s\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/app/key.properties

      - name: Install dependencies
        run: flutter pub get

      # versionCode は Play に上がっている最大の次。実行番号 + 300 で決めていた頃は
      # 別経路で上がった番号とぶつかり、アップロードが成功表示のまま Play に
      # 入らなかった（1.4.20 の 308）。
      - name: Decide versionCode
        id: version_code
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ steps.secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet --disable-pip-version-check google-auth requests
          code=$("$RUNNER_TEMP/play/bin/python" scripts/play_release.py next-code)
          echo "versionCode=$code"
          echo "value=$code" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        run: flutter build appbundle --dart-define=ENV=prod --build-number=${{ steps.version_code.outputs.value }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aab-prod
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5
          if-no-files-found: error

  # ビルド成功後にここだけ失敗した場合、"Re-run failed jobs" でこのジョブのみ再実行できる
  upload-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aab-prod
          path: aab

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: secrets
        with:
          secrets: |-
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:${{ env.GCP_PROJECT }}/ci-google-play-service-account

      # 下書きで上げ、公開は Play Console で行う。未公開アプリには下書きしか作れない。
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thaimemo.thai_memo
          releaseFiles: aab/app-release.aab
          track: ${{ inputs.track }}
          status: draft
