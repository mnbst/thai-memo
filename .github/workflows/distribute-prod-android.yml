name: Distribute to Production (Android)

# push では動かさず、配信するときだけ手で起動する:
#   gh workflow run distribute-prod-android.yml --ref main -f track=internal
on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play のトラック
        type: choice
        options:
          - internal
          - alpha
          - production
        default: internal

permissions:
  contents: read
  pull-requests: read
  id-token: write  # WIF認証に必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WIF_PROVIDER: projects/219961294368/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider
  CI_SERVICE_ACCOUNT: github-actions-deployer@thai-memo-prod.iam.gserviceaccount.com
  GCP_PROJECT: thai-memo-prod

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # 3.x の最新は Gradle 8.14 以上を要求する。手元と同じ版に固定する。
          flutter-version: "3.41.5"
          channel: stable

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            GOOGLE_SERVICES_JSON:${{ env.GCP_PROJECT }}/ci-google-services-json
            KEYSTORE_BASE64:${{ env.GCP_PROJECT }}/ci-keystore
            KEY_ALIAS:${{ env.GCP_PROJECT }}/ci-key-alias
            KEY_PASSWORD:${{ env.GCP_PROJECT }}/ci-key-password
            STORE_PASSWORD:${{ env.GCP_PROJECT }}/ci-store-password
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:${{ env.GCP_PROJECT }}/ci-google-play-service-account

      - name: Restore google-services.json
        run: echo '${{ steps.secrets.outputs.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Restore keystore
        run: |
          echo "${{ steps.secrets.outputs.KEYSTORE_BASE64 }}" | base64 --decode > android/app/thai-memo-release.jks
          cat <<EOF > android/app/key.properties
          keyAlias=${{ steps.secrets.outputs.KEY_ALIAS }}
          keyPassword=${{ steps.secrets.outputs.KEY_PASSWORD }}
          storeFile=thai-memo-release.jks
          storePassword=${{ steps.secrets.outputs.STORE_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # versionCode は Play に上がっている最大の次。実行番号 + 300 で決めていた頃は
      # 別経路で上がった番号とぶつかり、アップロードが成功表示のまま Play に
      # 入らなかった（1.4.20 の 308）。
      - name: Decide versionCode
        id: version_code
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ steps.secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet --disable-pip-version-check google-auth requests
          code=$("$RUNNER_TEMP/play/bin/python" scripts/play_release.py next-code)
          echo "versionCode=$code"
          echo "value=$code" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        run: flutter build appbundle --dart-define=ENV=prod --build-number=${{ steps.version_code.outputs.value }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-prod
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5
          if-no-files-found: error

  # ビルド成功後にここだけ失敗した場合、"Re-run failed jobs" でこのジョブのみ再実行できる
  upload-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-prod
          path: aab

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Fetch secrets from Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:${{ env.GCP_PROJECT }}/ci-google-play-service-account

      # 下書きで上げ、公開は Play Console で行う。未公開アプリには下書きしか作れない。
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thaimemo.thai_memo
          releaseFiles: aab/app-release.aab
          track: ${{ inputs.track }}
          status: draft
