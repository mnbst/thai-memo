[project]
name = "thai-memo-functions"
version = "1.1.0"
description = "Cloud Functions for Thai Memo - generateThaiSentence"
requires-python = ">=3.12"
dependencies = [
    "firebase-functions>=0.4.0",
    "firebase-admin>=6.0.0",
    "google-genai>=1.0.0",
    "google-cloud-secret-manager>=2.0.0",
    "pythainlp>=5.0.0",
    "tltk>=1.10",
    "numpy>=1.26.0",
    "google-cloud-storage>=2.14.0",
    "grpcio!=1.78.1",
]

[dependency-groups]
dev = [
    "google-cloud-aiplatform>=1.145.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
